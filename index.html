emailBody:"Dear ODMHSAS Peer Recovery Support Team,\n\nI\u2019m reaching out because Oklahoma\u2019s Peer Division is doing exceptional work \u2014 1,000+ actively certified peers delivering 180,000+ services annually is remarkable. We\u2019d like to introduce two tools built for this workforce:\n\n1. BeePurple Classic \u2014 our Recovery Center CRM that lets PRSS document encounters from any phone or tablet, track recovery journeys, and generate ODMHSAS-compliant reports automatically. Already deployed at Healing Transitions in NC.\n\n2. The Peer Field Navigator \u2014 the first and only reference tool where Oklahoma\u2019s PRSS certification requirements, billing codes, and payer data sit alongside all 49 other states for instant comparison. No other resource compiles this.\n\nWe\u2019d love to present at an upcoming PRSS Support Call or at the Momentum Conference. Would the team be open to a brief demonstration?\n\nWarm regards,\nBeePurple Team\nhttps://beepurple.com"
},

emailBody:"Dear Zac,\n\nI\u2019m reaching out from BeePurple, a Kansas-based technology company in Wichita. We\u2019ve built two tools specifically relevant to the peer workforce you manage:\n\n1. BeePurple Classic \u2014 our Recovery Center CRM with mobile documentation for KCPS, KCPM, and KCPPSS peers. Tracks encounters, recovery plans, supervision hours, and generates billable service records. Already deployed at Healing Transitions in NC.\n\n2. The Peer Field Navigator \u2014 the first and only reference tool where all three KDADS peer certification tracks are mapped with billing codes, training requirements, and Medicaid rates \u2014 alongside every other state for comparison.\n\nAs a fellow Kansas organization, we\u2019d love to meet in person in Topeka to demonstrate both. Would you be open to a brief meeting?\n\nWarm regards,\nBeePurple Team\nWichita, Kansas\nhttps://beepurple.com"
},

emailBody:"Dear NC DHHS Peer Support Team,\n\nI\u2019m writing to share results from a technology deployment already underway in North Carolina \u2014 and to explore expanding it statewide.\n\nHealing Transitions in Raleigh is currently using BeePurple Classic for peer specialist documentation \u2014 encounter tracking, recovery plans, scheduling, and impact reporting from any mobile device.\n\nWe also offer the Peer Field Navigator \u2014 the first and only reference tool where NC\u2019s CPSS certification requirements, H0038 billing codes (including HK U4 for Peer Bridgers), and Medicaid rates are mapped alongside all 49 other states. No other resource compiles this data.\n\nWith 6,000+ CPSS certified and new specialized tracks in development, we\u2019d welcome the opportunity to present results and discuss statewide adoption. We\u2019ll be available around the NC One Community in Recovery Conference (March 4-6). Would a brief call work?\n\nWarm regards,\nBeePurple Team\nhttps://beepurple.com"
},

        <p style={{margin:"0 0 6px",fontSize:13,color:C.tx,lineHeight:1.5}}>{a.why}</p>

function matchNofo(text){
  var qs=text.split("\n").filter(function(l){return l.trim().length>8;});
  var questions=[],cur="";
  for(var i=0;i<qs.length;i++){
    var t=qs[i].trim();
    var isNew=/^\d+[.]\s|^[a-zA-Z][.]\s|^[-]\s|^Describe|^Explain|^Provide|^How |^What /.test(t);
    if(isNew&&cur){questions.push(cur);cur=t;}
    else if(isNew){cur=t;}
    else{cur+=" "+t;}
  }
  if(cur.trim().length>5)questions.push(cur.trim());
  if(questions.length===0&&text.trim().length>5)questions.push(text.trim());
  return questions.map(function(q){
    var ql=q.toLowerCase();
    var scored=KB.map(function(cap){
      var sc=0;
      cap.k.forEach(function(key){if(ql.indexOf(key)>=0)sc+=2;});
      cap.k.forEach(function(key){key.split(" ").forEach(function(w){if(w.length>3&&ql.indexOf(w)>=0)sc+=0.5;});});
      return{s:cap.s,r:cap.r,score:sc};
    }).filter(function(c){return c.score>0;}).sort(function(a,b){return b.score-a.score;});
    var resp=scored.length===0
      ?"BeePurple addresses this requirement through its purpose-built Recovery Center CRM providing HIPAA-compliant client tracking, demographic profiling, outcome measurement, and impact reporting. SOC 2 Type II certified. Validated through Healing Transitions.\n\n[Customize this response with specific details from the NOFO question.]"
      :scored.slice(0,3).map(function(c){return c.r;}).join("\n\n");
    if(scored.length>0&&resp.indexOf("Healing")<0)resp+="\n\nValidated through Healing Transitions Rapid Responder Program in Wake County, NC.";
    var conf=scored.length>0?(scored[0].score>=4?"high":scored[0].score>=2?"medium":"low"):"low";
    return{q:q,caps:scored.slice(0,3).map(function(s){return s.s;}),conf:conf,r:resp};
  });
}

      <div style={{display:"flex",gap:8,marginBottom:8}}>

        <pre style={{margin:0,fontSize:11,color:C.tx,lineHeight:1.6,whiteSpace:"pre-wrap",fontFamily:f}}>{p.emailBody}</pre>

function EmailTag({emailKey,emailStatus,toggleEmail}){
  if(!emailKey)return null;
  var val=emailStatus[emailKey]||null;
  var btnS={padding:"2px 7px",borderRadius:4,fontSize:9,fontWeight:700,cursor:"pointer",border:"none",marginLeft:4};
  return <span style={{display:"inline-flex",gap:2,alignItems:"center"}}>
    <button onClick={function(e){e.stopPropagation();toggleEmail(emailKey,"na");}} style={Object.assign({},btnS,{background:val==="na"?"rgba(212,114,114,0.2)":"transparent",color:val==="na"?C.ht:C.dm,border:"1px solid "+(val==="na"?C.ht:C.bd)})}>N/A</button>
    <button onClick={function(e){e.stopPropagation();toggleEmail(emailKey,"tg");}} style={Object.assign({},btnS,{background:val==="tg"?"rgba(92,192,126,0.2)":"transparent",color:val==="tg"?C.ok:C.dm,border:"1px solid "+(val==="tg"?C.ok:C.bd)})}>TG</button>
  </span>;
}

function ContactsTab({leads,emailStatus,toggleEmail}){
  var[search,setSearch]=useState("");
  var[sf,setSf]=useState("all");
  var allContacts=leads.filter(function(l){return l.type==="contact";});
  var naCount=allContacts.filter(function(c){return c.email&&emailStatus[c.email]==="na";}).length;
  var tgCount=allContacts.filter(function(c){return c.email&&emailStatus[c.email]==="tg";}).length;
  var noneCount=allContacts.filter(function(c){return !c.email||!emailStatus[c.email];}).length;
  var contacts=allContacts.filter(function(c){
    if(sf==="na")return c.email&&emailStatus[c.email]==="na";
    if(sf==="tg")return c.email&&emailStatus[c.email]==="tg";
    if(sf==="none")return !c.email||!emailStatus[c.email];
    return true;
  }).filter(function(c){
    if(!search)return true;
    var s=search.toLowerCase();
    return (c.ct_name||"").toLowerCase().includes(s)||(c.org||"").toLowerCase().includes(s)||(c.email||"").toLowerCase().includes(s)||(c.state||"").toLowerCase().includes(s);
  }).sort(function(a,b){var p={hot:0,high:1,medium:2};return(p[a.priority]!==undefined?p[a.priority]:3)-(p[b.priority]!==undefined?p[b.priority]:3);});
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <div style={{display:"flex",gap:8,flexWrap:"wrap",alignItems:"center"}}>
      <input value={search} onChange={function(e){setSearch(e.target.value);}} placeholder="Search name, org, email, state..." style={{padding:"6px 12px",borderRadius:6,border:"1px solid "+C.bd,background:C.sf,color:C.tx,fontSize:12,fontFamily:f,flex:"1 1 200px",minWidth:150}}/>
      <Chip active={sf==="all"} onClick={function(){setSf("all");}}>All ({allContacts.length})</Chip>
      <Chip active={sf==="none"} onClick={function(){setSf("none");}}>Untagged ({noneCount})</Chip>
      <Chip active={sf==="tg"} onClick={function(){setSf("tg");}}>TG ({tgCount})</Chip>
      <Chip active={sf==="na"} onClick={function(){setSf("na");}}>N/A ({naCount})</Chip>
    </div>
    <div style={{overflowX:"auto"}}><table style={{width:"100%",borderCollapse:"collapse",fontFamily:f,fontSize:12}}>
    <thead><tr>{["","Name","Title","Organization","State","Email","Status"].map(function(h){return <th key={h} style={{padding:"10px 8px",textAlign:"left",fontSize:10,fontWeight:700,textTransform:"uppercase",color:C.mu,borderBottom:"2px solid "+C.bd,whiteSpace:"nowrap"}}>{h}</th>;})}</tr></thead>
    <tbody>{contacts.map(function(c){var pc={hot:C.ht,high:C.wn,medium:C.tl};var es=c.email?emailStatus[c.email]||null:null;return <tr key={c.id} style={{borderBottom:"1px solid "+C.bd,background:es==="na"?"rgba(212,114,114,0.04)":es==="tg"?"rgba(92,192,126,0.04)":"transparent"}}>
      <td style={{padding:8}}><Bd bg={(pc[c.priority]||C.mu)+"22"} fg={pc[c.priority]||C.mu}>{c.priority.toUpperCase()}</Bd></td>
      <td style={{padding:8,color:C.tx,fontWeight:600,whiteSpace:"nowrap"}}>{c.ct_name}{c.url&&<>{" "}<a href={c.url} target="_blank" rel="noreferrer" style={{fontSize:10,color:"#0A66C2"}}>in</a></>}</td>
      <td style={{padding:8,color:C.mu,fontSize:11}}>{c.ct_title}</td>
      <td style={{padding:8,color:C.gl,fontWeight:600,whiteSpace:"nowrap"}}>{c.org}</td>
      <td style={{padding:8,color:C.mu}}>{c.state}</td>
      <td style={{padding:8}}>{c.email?<span style={{fontSize:11,color:C.tl}}>{c.email}</span>:<span style={{fontSize:10,color:C.dm}}>{"\u2014"}</span>}</td>
      <td style={{padding:8}}>{c.email?<EmailTag emailKey={c.email} emailStatus={emailStatus} toggleEmail={toggleEmail}/>:<span style={{fontSize:10,color:C.dm}}>{"\u2014"}</span>}</td>
    </tr>;})}</tbody>
  </table></div>
  </div>;
}

function EventsTab({events}){
  var[expanded,setExpanded]=useState(null);
  var[emailView,setEmailView]=useState(null);
  var[copied,setCopied]=useState("");
  function cp(t,l){try{navigator.clipboard.writeText(t);}catch(e){}setCopied(l);setTimeout(function(){setCopied("");},2000);}
  var sorted=events.slice().sort(function(a,b){var p={hot:0,high:1,medium:2};var pd=(p[a.priority]!==undefined?p[a.priority]:3)-(p[b.priority]!==undefined?p[b.priority]:3);if(pd!==0)return pd;return new Date(a.date)-new Date(b.date);});
  function attendReason(ev,m){
    var reasons={award:{},lead:{},contact:{},settlement:{}};
    if(m.type==="award"){
      if(ev.id==="e7")return "NAADAC members include addiction treatment orgs — "+m.name+" likely sending staff for CEUs and peer recovery sessions.";
      if(ev.id==="e1")return "NatCon draws CCBHC and behavioral health orgs — "+m.name+" as a SAMHSA grantee likely attends for compliance updates and networking.";
      if(ev.id==="e6")return "BRI Opioid Congress covers settlement fund management and MAT expansion — "+m.name+"'s grant work aligns with key sessions.";
      if(ev.id==="e8")return "NASMHPD is for state commissioners — "+m.name+" interfaces with state agencies for grant compliance and reporting.";
      if(ev.id==="e9")return "ARCHway focuses on treatment centers and RCOs in Arkansas region — "+m.name+" operates in neighboring states.";
      if(ev.id==="e3")return "RISE26 is for drug court professionals — "+m.name+" likely partners with drug courts for client referrals.";
      if(ev.id==="e4")return "Oklahoma Momentum is ODMHSAS's own conference — "+m.name+" operates in the ODMHSAS network.";
      return m.name+"'s program area ("+m.detail+") aligns with this event's ICP focus.";
    }
    if(m.type==="settlement"){
      if(ev.id==="e8")return m.name.replace(" Settlement","")+" decision-makers attend NASMHPD to coordinate with other state directors on settlement spending strategy.";
      if(ev.id==="e2")return "Block Grant Conference brings state agencies — "+m.name.replace(" Settlement","")+" officials attend to discuss funding allocation including settlement integration.";
      if(ev.id==="e6")return "BRI Congress has dedicated sessions on settlement fund management — "+m.name.replace(" Settlement","")+" officials likely present or attend.";
      return m.name.replace(" Settlement","")+" state officials likely attend to discuss funding strategies.";
    }
    if(m.type==="lead"){
      if(m.detail&&m.detail.indexOf("ODMHSAS")>=0&&ev.id==="e4")return "ODMHSAS network member — this is their home conference.";
      if(m.detail&&m.detail.indexOf("Kansas")>=0&&ev.id==="e7")return "Kansas-based org — NAADAC is in Kansas City, essentially a home conference.";
      return m.name+" operates in the "+ev.icps.map(function(ic){return(ICP.find(function(i){return i.id===ic;})||{l:ic}).l;}).join("/")+(" space — likely sends staff for professional development.");
    }
    if(m.type==="contact"){
      return m.name+" is a decision-maker in the "+ev.icps.map(function(ic){return(ICP.find(function(i){return i.id===ic;})||{l:ic}).l;}).join("/")+(" sector — key conferences are standard for networking and vendor meetings.");
    }
    return "Likely attendee based on ICP overlap.";
  }
  function getMatches(ev){
    var m=[];
    AWARDS.forEach(function(a){a.icpType&&ev.icps.indexOf(a.icpType)>=0&&m.push({type:"award",name:a.org,detail:a.program+" — "+a.amount,contact:a.contact,email:a.email,linkedin:a.linkedin||null});});
    LEADS.filter(function(l){return l.type!=="contact";}).forEach(function(l){l.icp&&ev.icps.indexOf(l.icp)>=0&&m.push({type:"lead",name:l.name,detail:l.note||"",contact:l.contact||"",email:l.email||"",linkedin:l.linkedin||null});});
    LEADS.filter(function(l){return l.type==="contact";}).forEach(function(l){l.icp&&ev.icps.indexOf(l.icp)>=0&&m.push({type:"contact",name:l.name,detail:l.title||"",contact:l.contact||l.name,email:l.email||"",linkedin:l.linkedin||null});});
    SETTLE.forEach(function(s){
      var stateMatch=false;ev.icps.forEach(function(ic){if(ic==="state_doh")stateMatch=true;});
      if(stateMatch&&s.priority==="hot")m.push({type:"settlement",name:s.state+" Settlement",detail:s.funds,contact:s.dm,email:s.contact});
    });
    return m;
  }
  function genEmail(ev,match){
    var days=Math.ceil((new Date(ev.date)-new Date())/86400000);
    var when=days>0?"in "+days+" days":"soon";
    return "Subject: BeePurple at "+ev.name+" — Let's connect\n\nHi "+(match.contact||"there")+",\n\nI noticed we'll both be at "+ev.name+" "+when+" in "+ev.city+". I'm with BeePurple — we build the Recovery Center CRM used by organizations like Healing Transitions for client tracking, peer documentation, SAMHSA reporting, and grant compliance.\n\nGiven your work"+(match.detail?" with "+match.detail:"")+", I think a 10-minute conversation could be valuable. Our Addiction Field Navigator and Peer Field Navigator are purpose-built tools that no other platform offers.\n\nWould you have time for a quick coffee or meeting at the event?\n\nBest,\n[Your Name]\nBeePurple | Recovery Center CRM\nbeepurple.com";
  }
  return <div style={{display:"flex",flexDirection:"column",gap:12}}>
    <div style={{padding:"10px 14px",background:C.gm,borderRadius:8,borderLeft:"3px solid "+C.gd}}><p style={{margin:0,fontSize:12,fontWeight:700,color:C.gd}}>Conference War Room</p><p style={{margin:"4px 0 0",fontSize:11,color:C.tx}}>Cross-referenced with Awards, Leads, Contacts, and Settlements. Expand to see likely attendees, why they'd be there, and generate pre-event outreach.</p></div>
  {sorted.map(function(ev){
    var days=Math.ceil((new Date(ev.date)-new Date())/86400000);
    var matches=getMatches(ev);
    var isExp=expanded===ev.id;
    return <Card key={ev.id} onClick={function(){setExpanded(isExp?null:ev.id);setEmailView(null);}} style={{cursor:"pointer",borderLeftWidth:3,borderLeftColor:ev.priority==="hot"?C.ht:C.wn}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:8}}>
        <div style={{display:"flex",gap:6}}><Bd bg={ev.priority==="hot"?C.ht+"22":C.wn+"22"} fg={ev.priority==="hot"?C.ht:C.wn}>{ev.priority.toUpperCase()}</Bd>{matches.length>0&&<Bd bg="rgba(92,192,126,0.15)" fg={C.ok}>{matches.length} MATCHES</Bd>}</div>
        <Bd bg={days<=7?C.ht+"22":days<=60?C.wn+"22":C.tl+"22"} fg={days<=7?C.ht:days<=60?C.wn:C.tl}>{days>0?days+" DAYS":"PAST"}</Bd>
      </div>
      <h3 style={{margin:"0 0 6px",fontSize:16,fontWeight:700,color:C.tx}}>{ev.name}</h3>
      <p style={{margin:"0 0 6px",fontSize:12,color:C.gd}}>{ev.city} — {new Date(ev.date).toLocaleDateString("en-US",{month:"long",day:"numeric",year:"numeric"})}</p>
      <p style={{margin:"0 0 8px",fontSize:13,color:C.tx,lineHeight:1.6}}>{ev.desc}</p>
      <div style={{display:"flex",gap:4,flexWrap:"wrap",marginBottom:8}}>{ev.icps.map(function(t){return <Bd key={t} bg={C.pm} fg={C.pl}>{(ICP.find(function(i){return i.id===t;})||{l:t}).l}</Bd>;})}</div>
      <div style={{display:"flex",gap:10,flexWrap:"wrap"}} onClick={function(e){e.stopPropagation();}}>
        {ev.url&&<a href={ev.url} target="_blank" rel="noreferrer" style={{fontSize:12,color:C.tl}}>Event Website ↗</a>}
        {ev.linkedin&&<a href={ev.linkedin} target="_blank" rel="noreferrer" style={{fontSize:12,color:"#0A66C2"}}>LinkedIn ↗</a>}
      </div>
      {isExp&&matches.length>0&&<div style={{marginTop:12,borderTop:"1px solid "+C.bd,paddingTop:12}} onClick={function(e){e.stopPropagation();}}>
        <p style={{margin:"0 0 8px",fontSize:12,fontWeight:700,color:C.gd}}>Likely Connections at This Event ({matches.length}):</p>
        {matches.map(function(m,i){var tmap={award:{bg:"rgba(92,192,126,0.15)",fg:C.ok,l:"AWARD"},lead:{bg:C.gm,fg:C.gd,l:"LEAD"},contact:{bg:C.pm,fg:C.pl,l:"CONTACT"},settlement:{bg:C.ht+"22",fg:C.ht,l:"$$$ SETTLE"}};var tc=tmap[m.type]||tmap.lead;
          var emailKey=ev.id+"-"+i;
          var showEmail=emailView===emailKey;
          var emailText=genEmail(ev,m);
          return <div key={i} style={{background:C.el,borderRadius:8,padding:"10px 12px",marginBottom:8,border:"1px solid "+C.bd}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <div style={{display:"flex",gap:6,alignItems:"center"}}><Bd bg={tc.bg} fg={tc.fg}>{tc.l}</Bd><span style={{fontSize:13,fontWeight:700,color:C.tx}}>{m.name}</span></div>
            </div>
            {m.detail&&<p style={{margin:"0 0 2px",fontSize:12,color:C.mu}}>{m.detail}</p>}
            {m.email&&<p style={{margin:"0 0 4px",fontSize:11,color:C.tl}}>{m.contact} — {m.email}{m.linkedin&&<> · <a href={m.linkedin} target="_blank" rel="noreferrer" style={{color:"#0A66C2",fontWeight:600}}>LinkedIn ↗</a></>}</p>}
            <p style={{margin:"0 0 8px",fontSize:11,color:C.gl,fontStyle:"italic",lineHeight:1.4}}>Why here: {attendReason(ev,m)}</p>
            <div style={{display:"flex",gap:6}}>
              <button onClick={function(){setEmailView(showEmail?null:emailKey);}} style={{padding:"4px 10px",borderRadius:6,border:"1px solid "+C.pp,background:showEmail?C.pm:"transparent",color:C.pl,fontSize:11,fontWeight:600,cursor:"pointer"}}>{showEmail?"Hide Email":"View Email"}</button>
              <button onClick={function(){cp(emailText,"copy-"+emailKey);}} style={{padding:"4px 10px",borderRadius:6,border:"1px solid "+C.gd,background:copied==="copy-"+emailKey?C.ok+"22":C.gm,color:copied==="copy-"+emailKey?C.ok:C.gd,fontSize:11,fontWeight:600,cursor:"pointer"}}>{copied==="copy-"+emailKey?"✓ Copied!":"Copy Email"}</button>
            </div>
            {showEmail&&<div style={{marginTop:8,background:C.sf,borderRadius:8,padding:"12px 14px",border:"1px solid "+C.bd,whiteSpace:"pre-wrap",fontSize:12,color:C.tx,lineHeight:1.6,fontFamily:"monospace"}}>{emailText}</div>}
          </div>;
        })}
      </div>}
      {isExp&&matches.length===0&&<p style={{marginTop:12,fontSize:12,color:C.mu,fontStyle:"italic"}}>No direct matches in current leads/awards — good cold outreach opportunity.</p>}
    </Card>;
  })}</div>;
}

        <button onClick={function(){if(nofoText.trim())setNofoResults(matchNofo(nofoText));}} disabled={!nofoText.trim()} style={{marginTop:10,padding:"10px 24px",borderRadius:8,border:"none",background:nofoText.trim()?"linear-gradient(135deg,#E8A94D,#D47272)":C.el,color:nofoText.trim()?C.wh:C.dm,fontSize:13,fontWeight:700,cursor:nofoText.trim()?"pointer":"not-allowed",fontFamily:f}}>Generate Responses</button>

        {nofoResults.length>0&&<div style={{marginTop:16,display:"flex",flexDirection:"column",gap:12}}>
          <div style={{display:"flex",gap:8}}>
            <Bd bg="rgba(92,192,126,0.15)" fg={C.ok}>{nofoResults.filter(function(r){return r.conf==="high";}).length} HIGH</Bd>
            <Bd bg={C.gm} fg={C.gd}>{nofoResults.filter(function(r){return r.conf==="medium";}).length} MED</Bd>
            <Bd bg="rgba(212,114,114,0.15)" fg={C.bd2}>{nofoResults.filter(function(r){return r.conf==="low";}).length} REVIEW</Bd>
          </div>
          {nofoResults.map(function(nr,i){
            var cc=nr.conf==="high"?C.ok:nr.conf==="medium"?C.gd:C.bd2;
            return <div key={i} style={{background:C.bg,borderRadius:10,border:"1px solid "+C.bd,overflow:"hidden"}}>
              <div style={{padding:"12px 16px",borderBottom:"1px solid "+C.bd,background:C.el}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
                  <span style={{fontSize:11,fontWeight:700,color:C.mu}}>Q{i+1}</span>
                  <div style={{display:"flex",gap:4}}><Bd bg={cc+"22"} fg={cc}>{nr.conf.toUpperCase()}</Bd><button onClick={function(){cp(nr.r,"q"+i);}} style={{padding:"3px 10px",borderRadius:6,border:"1px solid "+C.tl,background:C.tm,color:C.tl,fontSize:10,cursor:"pointer"}}>{copied==="q"+i?"Done":"Copy"}</button></div>
                </div>
                <p style={{margin:0,fontSize:13,color:C.tx,fontWeight:600}}>{nr.q}</p>
                {nr.caps.length>0&&<div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:6}}>{nr.caps.map(function(c){return <Bd key={c} bg={C.pm} fg={C.pl}>{c}</Bd>;})}</div>}
              </div>
              <div style={{padding:16}}>
                <pre style={{margin:0,fontFamily:f,fontSize:12,color:C.tx,lineHeight:1.7,whiteSpace:"pre-wrap"}}>{nr.r}</pre>
                {nr.conf==="low"&&<div style={{marginTop:10,padding:"8px 12px",background:"rgba(212,114,114,0.08)",borderRadius:6,borderLeft:"3px solid "+C.bd2}}><p style={{margin:0,fontSize:11,color:C.bd2}}>Low confidence. Customize with specific details from the NOFO.</p></div>}
              </div>
            </div>;
          })}
        </div>}
      </div>
    </Card>}
  </div>;
}

export default function App(){
  var[tab,setTab]=useState("pipeline");
  var[sel,setSel]=useState(null);
  var[rfpStatus,setRfpStatus]=useState({});
  var[emailStatus,setEmailStatus]=useState({});
  function toggleRfp(id,val){setRfpStatus(function(prev){var n=Object.assign({},prev);n[id]=prev[id]===val?null:val;return n;});}
  function toggleEmail(key,val){setEmailStatus(function(prev){var n=Object.assign({},prev);n[key]=prev[key]===val?null:val;return n;});}
  var st={rfps:RFPS.length,bp:RFPS.filter(function(r){return r.angle==="beepurple";}).length,icp:RFPS.filter(function(r){return r.angle==="icp";}).length,leads:LEADS.length,hot:LEADS.filter(function(l){return l.priority==="hot";}).length,contacts:LEADS.filter(function(l){return l.type==="contact";}).length,events:EVENTS.length,awards:AWARDS.length,awardsHot:AWARDS.filter(function(a){return a.fit==="hot";}).length};
  var tabs=[{id:"pipeline",l:"RFPs",n:st.rfps},{id:"awards",l:"Awards",n:st.awards},{id:"directory",l:"No CRM",n:DIRECTORY.length},{id:"peers",l:"Peer Pipeline",n:PEERPIPE.length},{id:"settle",l:"Settlements",n:SETTLE.length},{id:"leads",l:"Leads",n:st.leads-st.contacts},{id:"contacts",l:"Contacts",n:st.contacts},{id:"events",l:"Events",n:st.events}];

  return <div style={{minHeight:"100vh",background:C.bg,color:C.tx,fontFamily:f}}>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <header style={{background:C.sf,borderBottom:"1px solid "+C.bd,padding:"12px 20px"}}>
      <div style={{maxWidth:1200,margin:"0 auto",display:"flex",alignItems:"center",justifyContent:"space-between",flexWrap:"wrap",gap:10}}>
        <div style={{display:"flex",alignItems:"center",gap:12}}><span style={{fontSize:26}}>{"🐝"}</span><div><h1 style={{margin:0,fontSize:18,fontWeight:700}}>BeePurple Sales Pipeline</h1><p style={{margin:0,fontSize:11,color:C.mu}}>RFPs - Leads - Events - Contacts</p></div></div>
        <div style={{display:"flex",gap:8}}>{st.hot>0&&<Bd bg={C.ht+"22"} fg={C.ht}>{"🔥"} {st.hot} hot</Bd>}<Bd bg={C.tm} fg={C.tl}>{st.rfps+st.leads} tracked</Bd></div>
      </div>
    </header>
    <nav style={{background:C.sf,borderBottom:"1px solid "+C.bd,padding:"0 12px",overflowX:"auto",WebkitOverflowScrolling:"touch"}}>
      <div style={{maxWidth:1200,margin:"0 auto",display:"flex",minWidth:"max-content"}}>
        {tabs.map(function(t){return <button key={t.id} onClick={function(){setTab(t.id);setSel(null);}} style={{padding:"10px 12px",background:"none",border:"none",borderBottom:tab===t.id?"2px solid "+C.gd:"2px solid transparent",color:tab===t.id?C.gl:C.mu,fontSize:12,fontWeight:600,fontFamily:f,cursor:"pointer",display:"flex",alignItems:"center",gap:5,whiteSpace:"nowrap"}}>
          {t.l}<span style={{padding:"1px 6px",borderRadius:10,fontSize:10,fontWeight:700,background:C.el,color:C.mu}}>{t.n}</span>
        </button>;})}
      </div>
    </nav>
    <div style={{background:C.cd,borderBottom:"1px solid "+C.bd,padding:"12px 20px"}}>
      <div style={{maxWidth:1200,margin:"0 auto",display:"grid",gridTemplateColumns:"repeat(auto-fill, minmax(110px, 1fr))",gap:8}}>
        <SC label="Total RFPs" value={st.rfps}/><SC label="Direct" value={st.bp} color={C.pl}/><SC label="ICP" value={st.icp} color={C.gl}/><SC label="Awards" value={st.awards} color={C.ok}/><SC label="Hot Leads" value={st.hot} color={C.ht}/><SC label="Events" value={st.events} color={C.tl}/>
      </div>
    </div>
    <main style={{maxWidth:1200,margin:"0 auto",padding:"20px 16px"}}>
      {sel?<RfpDetail rfp={sel} onBack={function(){setSel(null);}} rfpStatus={rfpStatus} toggleRfp={toggleRfp} emailStatus={emailStatus} toggleEmail={toggleEmail}/>:
       tab==="pipeline"?<PipelineTab rfps={RFPS} onSelect={setSel} rfpStatus={rfpStatus} toggleRfp={toggleRfp} emailStatus={emailStatus} toggleEmail={toggleEmail}/>:
       tab==="awards"?<AwardsTab awards={AWARDS} emailStatus={emailStatus} toggleEmail={toggleEmail}/>:
       tab==="directory"?<DirectoryTab items={DIRECTORY} emailStatus={emailStatus} toggleEmail={toggleEmail}/>:
       tab==="peers"?<PeerPipeTab items={PEERPIPE} emailStatus={emailStatus} toggleEmail={toggleEmail}/>:
       tab==="settle"?<SettleTab items={SETTLE} emailStatus={emailStatus} toggleEmail={toggleEmail}/>:
       tab==="leads"?<LeadsTab leads={LEADS} emailStatus={emailStatus} toggleEmail={toggleEmail}/>:
       tab==="contacts"?<ContactsTab leads={LEADS} emailStatus={emailStatus} toggleEmail={toggleEmail}/>:
       tab==="events"?<EventsTab events={EVENTS}/>:null}
    </main>
    <footer style={{borderTop:"1px solid "+C.bd,padding:"12px 20px",textAlign:"center"}}><p style={{margin:0,fontSize:11,color:C.dm}}>BeePurple Sales Pipeline</p></footer>
  </div>;
}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
