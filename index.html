function StatusBadge({ status }) {
  const map = {
    new: { bg: "rgba(77,184,168,0.15)", fg: C.teal, label: "NEW" },
    review: { bg: "rgba(212,168,83,0.15)", fg: C.gold, label: "IN REVIEW" },
    approved: { bg: "rgba(92,192,126,0.15)", fg: C.ok, label: "APPROVED" },
    submitted: { bg: "rgba(155,107,194,0.15)", fg: C.purple, label: "SUBMITTED" },
    declined: { bg: "rgba(212,114,114,0.15)", fg: C.bad, label: "DECLINED" },
  };
  const s = map[status] || map.new;
  return <span style={{ display: "inline-block", padding: "3px 10px", borderRadius: 20, fontSize: 10, fontWeight: 700, letterSpacing: 0.8, fontFamily: ff, background: s.bg, color: s.fg, textTransform: "uppercase" }}>{s.label}</span>;
}

function VerifiedBadge() {
  return <span style={{ display: "inline-block", padding: "3px 10px", borderRadius: 20, fontSize: 10, fontWeight: 700, letterSpacing: 0.6, fontFamily: ff, background: "rgba(92,192,126,0.15)", color: C.ok, border: "1px solid rgba(92,192,126,0.3)" }}>✓ VERIFIED</span>;
}

function FitScore({ score }) {
  const color = score >= 90 ? C.ok : score >= 75 ? C.gold : C.bad;
  return (
    <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
      <div style={{ width: 60, height: 6, background: C.border, borderRadius: 3, overflow: "hidden" }}>
        <div style={{ width: `${score}%`, height: "100%", background: color, borderRadius: 3 }} />
      </div>
      <span style={{ fontFamily: mono, fontSize: 13, fontWeight: 700, color }}>{score}%</span>
    </div>
  );
}

function DaysUntil({ date }) {
  const d = Math.ceil((new Date(date) - new Date()) / 86400000);
  const color = d <= 14 ? C.bad : d <= 30 ? C.warn : C.teal;
  return <span style={{ fontFamily: mono, fontSize: 12, fontWeight: 600, color }}>{d > 0 ? `${d}d` : "PAST"}</span>;
}

function Chip({ children, active, onClick }) {
  return <button onClick={onClick} style={{ padding: "6px 14px", borderRadius: 20, border: `1px solid ${active ? C.gold : C.border}`, background: active ? C.goldDim : "transparent", color: active ? C.goldLight : C.textMuted, fontFamily: ff, fontSize: 12, fontWeight: 600, cursor: "pointer", transition: "all 0.15s", whiteSpace: "nowrap" }}>{children}</button>;
}

            <>
              <div>
                <h4 style={{ fontFamily: ff, fontSize: 13, fontWeight: 700, color: C.gold, margin: "0 0 10px", textTransform: "uppercase", letterSpacing: 0.5 }}>Executive Summary (Auto-Generated)</h4>
                <pre style={{ background: C.bg, borderRadius: 8, padding: 16, fontFamily: ff, fontSize: 12, color: C.text, lineHeight: 1.6, whiteSpace: "pre-wrap", border: `1px solid ${C.border}` }}>{bpSubmissionContent.executiveSummary}</pre>
              </div>
              <div>
                <h4 style={{ fontFamily: ff, fontSize: 13, fontWeight: 700, color: C.gold, margin: "0 0 10px", textTransform: "uppercase", letterSpacing: 0.5 }}>Technical Approach — Requirement-by-Requirement</h4>
                <pre style={{ background: C.bg, borderRadius: 8, padding: 16, fontFamily: ff, fontSize: 12, color: C.text, lineHeight: 1.6, whiteSpace: "pre-wrap", border: `1px solid ${C.border}`, maxHeight: 400, overflow: "auto" }}>{bpSubmissionContent.technicalApproach}</pre>
              </div>
            </>
          ) : (
            <>
              <div>
                <h4 style={{ fontFamily: ff, fontSize: 13, fontWeight: 700, color: C.teal, margin: "0 0 4px", textTransform: "uppercase", letterSpacing: 0.5 }}>📄 Draft Proposal Section — "Technology Solution"</h4>
                <p style={{ fontFamily: ff, fontSize: 11, color: C.textMuted, margin: "0 0 10px" }}>This is the section {icpTarget?.org || "the ICP"} would insert into their {rfp.sourceRef} submission. It positions BeePurple as their technology partner, maps each requirement to BeePurple capabilities, and includes implementation timeline, security compliance, and budget justification.</p>
                <div style={{ position: "relative" }}>
                  <button onClick={() => { navigator.clipboard?.writeText(icpProposalSection); }} style={{ position: "absolute", top: 8, right: 8, padding: "4px 12px", borderRadius: 6, border: `1px solid ${C.teal}`, background: C.tealDim, color: C.teal, fontFamily: ff, fontSize: 10, fontWeight: 600, cursor: "pointer", zIndex: 1 }}>Copy Section</button>
                  <pre style={{ background: C.bg, borderRadius: 8, padding: 16, fontFamily: ff, fontSize: 11, color: C.text, lineHeight: 1.6, whiteSpace: "pre-wrap", border: `1px solid ${C.border}`, maxHeight: 400, overflow: "auto" }}>{icpProposalSection}</pre>
                </div>
              </div>
              <div>
                <h4 style={{ fontFamily: ff, fontSize: 13, fontWeight: 700, color: C.gold, margin: "0 0 4px", textTransform: "uppercase", letterSpacing: 0.5 }}>📧 C-Suite Outreach Email Template</h4>
                <p style={{ fontFamily: ff, fontSize: 11, color: C.textMuted, margin: "0 0 10px" }}>Send this to {icpTarget?.csuite || "the C-suite contact"} to introduce BeePurple as their technology partner for this opportunity.</p>
                <div style={{ position: "relative" }}>
                  <button onClick={() => { navigator.clipboard?.writeText(icpEmailTemplate); }} style={{ position: "absolute", top: 8, right: 8, padding: "4px 12px", borderRadius: 6, border: `1px solid ${C.gold}`, background: C.goldDim, color: C.goldLight, fontFamily: ff, fontSize: 10, fontWeight: 600, cursor: "pointer", zIndex: 1 }}>Copy Email</button>
                  <pre style={{ background: C.bg, borderRadius: 8, padding: 16, fontFamily: ff, fontSize: 12, color: C.text, lineHeight: 1.6, whiteSpace: "pre-wrap", border: `1px solid ${C.border}`, maxHeight: 350, overflow: "auto" }}>{icpEmailTemplate}</pre>
                </div>
              </div>
            </>
          )}

          {!approved ? (
            <button onClick={handleApprove} style={{ padding: "14px 28px", borderRadius: 10, border: "none", background: `linear-gradient(135deg, ${C.gold}, ${C.purple})`, color: C.white, fontFamily: ff, fontSize: 14, fontWeight: 700, cursor: "pointer", alignSelf: "center" }}>
              ✓ Approve & {isBP ? "Generate Full Submission Draft" : "Generate Outreach Package"}
            </button>
          ) : (
            <div style={{ textAlign: "center", padding: 20, background: "rgba(92,192,126,0.1)", borderRadius: 10, border: "1px solid rgba(92,192,126,0.25)" }}>
              <span style={{ fontFamily: ff, fontSize: 16, fontWeight: 700, color: C.ok }}>✓ Approved!</span>
              <p style={{ fontFamily: ff, fontSize: 13, color: C.textMuted, margin: "6px 0 0" }}>
                {isBP ? "Submission draft generated. Review and customize before final submission." : "Outreach package generated. Contact export and email templates ready."}
              </p>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// RFP DETAIL VIEW
// ═══════════════════════════════════════════════════════════
function RFPDetail({ rfp, onBack, onApprove }) {
  const [showEmail, setShowEmail] = useState(false);
  const [showContacts, setShowContacts] = useState(false);
  const [showApprove, setShowApprove] = useState(false);
  const isBP = rfp.angle === "beepurple";
  const src = SOURCES.find(s => s.id === rfp.source);

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
      <button onClick={onBack} style={{ alignSelf: "flex-start", padding: "6px 16px", borderRadius: 8, border: `1px solid ${C.border}`, background: "transparent", color: C.textMuted, fontFamily: ff, fontSize: 12, cursor: "pointer" }}>← Back to Pipeline</button>

      <div style={{ background: C.card, borderRadius: 14, border: `1px solid ${C.border}`, padding: 24 }}>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 12 }}>
          <AngleBadge angle={rfp.angle} />
          <StatusBadge status={rfp.status} />
          {rfp.verified && <VerifiedBadge />}
          <FitScore score={rfp.fitScore} />
        </div>
        <h1 style={{ fontFamily: ff, fontSize: 24, fontWeight: 700, color: C.text, margin: "0 0 8px" }}>{rfp.title}</h1>
        <p style={{ fontFamily: ff, fontSize: 14, color: C.textMuted, margin: "0 0 16px" }}>{rfp.agency} • {rfp.state}</p>

        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(160px, 1fr))", gap: 12, marginBottom: 20 }}>
          {[
            { label: "Source", value: src?.name, sub: rfp.sourceRef },
            { label: "Amount", value: rfp.amount },
            { label: "Posted", value: new Date(rfp.posted).toLocaleDateString() },
            { label: "Deadline", value: <><DaysUntil date={rfp.deadline} /> — {new Date(rfp.deadline).toLocaleDateString()}</> },
          ].map((item, i) => (
            <div key={i} style={{ background: C.elevated, borderRadius: 8, padding: 12, border: `1px solid ${C.border}` }}>
              <p style={{ fontFamily: ff, fontSize: 10, fontWeight: 600, color: C.textMuted, margin: 0, textTransform: "uppercase", letterSpacing: 0.5 }}>{item.label}</p>
              <p style={{ fontFamily: ff, fontSize: 14, fontWeight: 600, color: C.text, margin: "4px 0 0" }}>{item.value}</p>
              {item.sub && <p style={{ fontFamily: mono, fontSize: 11, color: C.textDim, margin: "2px 0 0" }}>{item.sub}</p>}
            </div>
          ))}
        </div>

        {rfp.deadlineNote && <DeadlineNote note={rfp.deadlineNote} />}

        <h3 style={{ fontFamily: ff, fontSize: 14, fontWeight: 700, color: C.gold, margin: "16px 0 8px" }}>Overview</h3>
        <p style={{ fontFamily: ff, fontSize: 13, color: C.text, lineHeight: 1.7, margin: "0 0 20px" }}>{rfp.overview}</p>

        <h3 style={{ fontFamily: ff, fontSize: 14, fontWeight: 700, color: C.purple, margin: "0 0 8px" }}>Why This Fits {isBP ? "BeePurple" : "ICP Outreach"}</h3>
        <p style={{ fontFamily: ff, fontSize: 13, color: C.text, lineHeight: 1.7, margin: "0 0 20px", padding: "12px 16px", background: C.purpleDim, borderRadius: 8, borderLeft: `3px solid ${C.purple}` }}>{rfp.fitReason}</p>

        {rfp.requirements && (
          <>
            <h3 style={{ fontFamily: ff, fontSize: 14, fontWeight: 700, color: C.teal, margin: "0 0 8px" }}>Requirements</h3>
            <div style={{ display: "flex", flexDirection: "column", gap: 4, marginBottom: 20 }}>
              {rfp.requirements.map((r, i) => (
                <div key={i} style={{ padding: "8px 12px", background: i % 2 === 0 ? C.elevated : "transparent", borderRadius: 6, fontFamily: ff, fontSize: 12, color: C.text, display: "flex", gap: 8 }}>
                  <span style={{ color: C.teal, fontWeight: 700, flexShrink: 0 }}>{i + 1}.</span>
                  <span>{r}</span>
                </div>
              ))}
            </div>
          </>
        )}

        {rfp.contacts && (
          <>
            <h3 style={{ fontFamily: ff, fontSize: 14, fontWeight: 700, color: C.gold, margin: "0 0 8px" }}>Agency Contacts</h3>
            <div style={{ display: "flex", gap: 10, flexWrap: "wrap", marginBottom: 20 }}>
              {rfp.contacts.map((c, i) => (
                <div key={i} style={{ background: C.elevated, borderRadius: 8, padding: 12, border: `1px solid ${C.border}`, flex: "1 1 240px" }}>
                  <p style={{ fontFamily: ff, fontSize: 13, fontWeight: 600, color: C.text, margin: 0 }}>{c.name}</p>
                  <p style={{ fontFamily: ff, fontSize: 11, color: C.textMuted, margin: "2px 0" }}>{c.title} • {c.org}</p>
                  <p style={{ fontFamily: mono, fontSize: 11, color: C.gold, margin: "2px 0 0" }}>{c.email}</p>
                </div>
              ))}
            </div>
          </>
        )}

        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <button onClick={() => setShowEmail(true)} style={{ padding: "10px 20px", borderRadius: 8, border: "none", background: C.goldDim, color: C.goldLight, fontFamily: ff, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>📧 View Email Notification</button>
          {rfp.icpTargets && <button onClick={() => setShowContacts(true)} style={{ padding: "10px 20px", borderRadius: 8, border: "none", background: C.tealDim, color: C.teal, fontFamily: ff, fontSize: 13, fontWeight: 600, cursor: "pointer" }}>📊 Export ICP Contacts</button>}
          <button onClick={() => setShowApprove(true)} style={{ padding: "10px 20px", borderRadius: 8, border: "none", background: `linear-gradient(135deg, ${C.gold}, ${C.purple})`, color: C.white, fontFamily: ff, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>✓ Approve & Generate</button>
        </div>
      </div>

      {showEmail && <EmailNotification rfp={rfp} onClose={() => setShowEmail(false)} />}
      {showContacts && <ContactExport rfp={rfp} onClose={() => setShowContacts(false)} />}
      {showApprove && <ApprovePanel rfp={rfp} onClose={() => setShowApprove(false)} onApprove={onApprove} />}
    </div>
  );
}

// ═══════════════════════════════════════════════════════════
// MAIN APP
// ═══════════════════════════════════════════════════════════
function App() {
  const [view, setView] = useState("pipeline");
  const [selectedRfp, setSelectedRfp] = useState(null);
  const [angleFilter, setAngleFilter] = useState("all");
  const [statusFilter, setStatusFilter] = useState("all");
  const [rfpData, setRfpData] = useState(RFPS);

  const filtered = useMemo(() => {
    return rfpData.filter(r =>
      (angleFilter === "all" || r.angle === angleFilter) &&
      (statusFilter === "all" || r.status === statusFilter)
    ).sort((a, b) => b.fitScore - a.fitScore);
  }, [rfpData, angleFilter, statusFilter]);

  const stats = useMemo(() => ({
    total: rfpData.length,
    bp: rfpData.filter(r => r.angle === "beepurple").length,
    icp: rfpData.filter(r => r.angle === "icp").length,
    newCount: rfpData.filter(r => r.status === "new").length,
    approved: rfpData.filter(r => r.status === "approved").length,
    urgent: rfpData.filter(r => Math.ceil((new Date(r.deadline) - new Date()) / 86400000) <= 30).length,
  }), [rfpData]);

  const handleApprove = useCallback((id) => {
    setRfpData(prev => prev.map(r => r.id === id ? { ...r, status: "approved" } : r));
  }, []);

  const openDetail = (rfp) => { setSelectedRfp(rfp); setView("detail"); };

  return (
    <div style={{ minHeight: "100vh", background: C.bg, color: C.text, fontFamily: ff }}>
      <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
      <style>{`
        * { box-sizing: border-box; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: ${C.bg}; }
        ::-webkit-scrollbar-thumb { background: ${C.border}; border-radius: 3px; }
        @media (max-width: 640px) {
          table th, table td { padding: 6px 6px !important; font-size: 11px !important; }
        }
      `}</style>

      {/* HEADER */}
      <header style={{ background: C.surface, borderBottom: `1px solid ${C.border}`, padding: "12px 20px" }}>
        <div style={{ maxWidth: 1200, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
            <span style={{ fontSize: 24 }}>🐝</span>
            <div>
              <h1 style={{ margin: 0, fontSize: 17, fontWeight: 700, color: C.text }}>BeePurple RFP Pipeline</h1>
              <p style={{ margin: 0, fontSize: 11, color: C.textMuted }}>Outreach Workflow — Direct Submissions & ICP Opportunities</p>
            </div>
          </div>
          <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
            {stats.newCount > 0 && <span style={{ padding: "4px 12px", borderRadius: 20, background: "rgba(77,184,168,0.15)", color: C.teal, fontSize: 11, fontWeight: 700 }}>{stats.newCount} new</span>}
            {stats.urgent > 0 && <span style={{ padding: "4px 12px", borderRadius: 20, background: "rgba(212,114,114,0.15)", color: C.bad, fontSize: 11, fontWeight: 700 }}>{stats.urgent} urgent</span>}
          </div>
        </div>
      </header>

      <main style={{ maxWidth: 1200, margin: "0 auto", padding: "20px 16px" }}>
        {view === "detail" && selectedRfp ? (
          <RFPDetail rfp={rfpData.find(r => r.id === selectedRfp.id) || selectedRfp} onBack={() => setView("pipeline")} onApprove={handleApprove} />
        ) : (
          <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
            {/* STATS ROW */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(140px, 1fr))", gap: 10 }}>
              {[
                { label: "Total RFPs", value: stats.total, color: C.text },
                { label: "BeePurple Direct", value: stats.bp, color: C.purpleLight },
                { label: "ICP Opportunities", value: stats.icp, color: C.goldLight },
                { label: "Approved", value: stats.approved, color: C.ok },
                { label: "Urgent (≤30d)", value: stats.urgent, color: C.bad },
              ].map((s, i) => (
                <div key={i} style={{ background: C.card, borderRadius: 10, padding: "12px 14px", border: `1px solid ${C.border}` }}>
                  <p style={{ margin: 0, fontSize: 10, fontWeight: 600, color: C.textMuted, textTransform: "uppercase", letterSpacing: 0.5 }}>{s.label}</p>
                  <p style={{ margin: "4px 0 0", fontSize: 24, fontWeight: 800, color: s.color }}>{s.value}</p>
                </div>
              ))}
            </div>

            {/* MONITORING SOURCES */}
            <div style={{ background: C.card, borderRadius: 12, border: `1px solid ${C.border}`, padding: 16 }}>
              <h3 style={{ margin: "0 0 10px", fontSize: 12, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", letterSpacing: 0.8 }}>📡 Monitored Sources</h3>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {SOURCES.map(s => (
                  <span key={s.id} title={s.desc} style={{ padding: "4px 12px", borderRadius: 20, background: C.elevated, border: `1px solid ${C.border}`, fontSize: 11, fontWeight: 600, color: C.textMuted, cursor: "default" }}>
                    <span style={{ color: s.type === "Federal" ? C.teal : C.gold }}>{s.type === "Federal" ? "🏛" : "🗺"}</span> {s.name}
                  </span>
                ))}
              </div>
            </div>

            {/* FILTERS */}
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
              <span style={{ fontSize: 11, fontWeight: 600, color: C.textDim, textTransform: "uppercase" }}>Angle:</span>
              <Chip active={angleFilter === "all"} onClick={() => setAngleFilter("all")}>All</Chip>
              <Chip active={angleFilter === "beepurple"} onClick={() => setAngleFilter("beepurple")}>🐝 BeePurple</Chip>
              <Chip active={angleFilter === "icp"} onClick={() => setAngleFilter("icp")}>🎯 ICP</Chip>
              <span style={{ width: 1, height: 20, background: C.border, margin: "0 4px" }} />
              <span style={{ fontSize: 11, fontWeight: 600, color: C.textDim, textTransform: "uppercase" }}>Status:</span>
              <Chip active={statusFilter === "all"} onClick={() => setStatusFilter("all")}>All</Chip>
              <Chip active={statusFilter === "new"} onClick={() => setStatusFilter("new")}>New</Chip>
              <Chip active={statusFilter === "approved"} onClick={() => setStatusFilter("approved")}>Approved</Chip>
            </div>

            {/* RFP CARDS */}
            <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
              {filtered.map(rfp => {
                const src = SOURCES.find(s => s.id === rfp.source);
                return (
                  <div key={rfp.id} onClick={() => openDetail(rfp)} style={{ background: C.card, borderRadius: 12, border: `1px solid ${C.border}`, padding: "16px 20px", cursor: "pointer", transition: "border-color 0.2s", borderLeftWidth: 3, borderLeftColor: rfp.angle === "beepurple" ? C.purple : C.gold }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
                      <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
                        <AngleBadge angle={rfp.angle} />
                        <StatusBadge status={rfp.status} />
                        {rfp.verified && <VerifiedBadge />}
                      </div>
                      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        <FitScore score={rfp.fitScore} />
                        <DaysUntil date={rfp.deadline} />
                      </div>
                    </div>
                    <h3 style={{ margin: "0 0 4px", fontSize: 16, fontWeight: 700, color: C.text }}>{rfp.title}</h3>
                    <p style={{ margin: "0 0 8px", fontSize: 12, color: C.textMuted }}>{rfp.agency} • {rfp.state} • {src?.name} {rfp.sourceRef}</p>
                    <p style={{ margin: "0 0 8px", fontSize: 13, color: C.text, lineHeight: 1.5, display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{rfp.overview}</p>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", flexWrap: "wrap", gap: 8 }}>
                      <span style={{ fontSize: 13, fontWeight: 700, color: C.ok }}>{rfp.amount}</span>
                      <span style={{ fontSize: 12, color: C.gold, fontWeight: 600 }}>View details →</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </main>

      <footer style={{ borderTop: `1px solid ${C.border}`, padding: "12px 20px", textAlign: "center" }}>
        <p style={{ margin: 0, fontSize: 11, color: C.textDim }}>BeePurple RFP Pipeline • Monitoring {SOURCES.length} sources • {rfpData.length} opportunities tracked</p>
      </footer>
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
