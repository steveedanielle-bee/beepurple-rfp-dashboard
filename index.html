<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeePurple Sales Pipeline</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐝</text></svg>">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.6/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0F0E13; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useMemo, useCallback, useEffect } = React;


const API = "https://beepurple-rfp-monitor-production.up.railway.app";
const BP = {
  name: "BeePurple", tagline: "Recovery Center CRM", url: "https://beepurple.com",
  features: ["HIPAA-compliant Recovery Center CRM","Recovery journey tracking","Demographic profiles & documentation","Data insights & impact reporting","Custom fields, forms & workflows","KitKeeper (Naloxone/NRT tracking)","Recovery Centers Directory (50 states)","SOC 2 Type II compliant"],
  icpTypes: [
    { id: "state_doh", label: "State DoH" },{ id: "recovery_center", label: "Recovery Centers" },
    { id: "treatment_center", label: "Treatment Centers" },{ id: "court", label: "Drug/Treatment Courts" },
    { id: "recovery_house", label: "Recovery Houses" },{ id: "ccbhc", label: "CCBHCs" },
    { id: "peer_org", label: "Peer Support Orgs" },{ id: "sheriff", label: "Sheriff's Offices" },
  ],
};
const C = { bg: "#0F0E13", surface: "#18171E", card: "#1E1D26", elevated: "#252430", border: "#2E2D3A", gold: "#D4A853", goldLight: "#E8C878", goldDim: "rgba(212,168,83,0.15)", purple: "#9B6BC2", purpleLight: "#B88EDB", purpleDim: "rgba(155,107,194,0.12)", teal: "#4DB8A8", tealDim: "rgba(77,184,168,0.1)", text: "#E8E6EF", textMuted: "#8B8799", textDim: "#5C5870", ok: "#5CC07E", warn: "#E8A94D", bad: "#D47272", hot: "#FF4444", white: "#fff" };
const ff = "'DM Sans','Segoe UI',sans-serif";
const mono = "'JetBrains Mono','SF Mono',monospace";
const PRIO = { hot: { bg: "rgba(255,68,68,0.15)", fg: "#FF4444", icon: "🔥", l: "HOT" }, high: { bg: "rgba(232,169,77,0.15)", fg: "#E8A94D", icon: "⚡", l: "HIGH" }, medium: { bg: "rgba(77,184,168,0.15)", fg: "#4DB8A8", icon: "📋", l: "MED" }, low: { bg: "rgba(139,135,153,0.15)", fg: "#8B8799", icon: "📎", l: "LOW" } };
const LTYPES = { job_signal: { icon: "📋", l: "Excel Signal", c: C.warn }, award: { icon: "💰", l: "Funded", c: C.ok }, settlement: { icon: "⚖️", l: "Settlement", c: C.gold }, competitor: { icon: "🔄", l: "Competitor", c: C.purpleLight }, new_org: { icon: "🌱", l: "New Org", c: C.teal }, contact: { icon: "👤", l: "Contact", c: C.goldLight } };

function B({ bg, fg, children }) { return <span style={{ display: "inline-block", padding: "3px 10px", borderRadius: 20, fontSize: 10, fontWeight: 700, letterSpacing: 0.6, fontFamily: ff, background: bg, color: fg, textTransform: "uppercase" }}>{children}</span>; }
function PB({ p }) { const v = PRIO[p] || PRIO.medium; return <B bg={v.bg} fg={v.fg}>{v.icon} {v.l}</B>; }
function TB({ t }) { const v = LTYPES[t]; if (!v) return null; return <B bg={v.c + "22"} fg={v.c}>{v.icon} {v.l}</B>; }
function AB({ a }) { const bp = a === "beepurple"; return <B bg={bp ? C.purpleDim : C.goldDim} fg={bp ? C.purpleLight : C.goldLight}>{bp ? "🐝 BEEPURPLE" : "🎯 ICP"}</B>; }
function SB({ s }) { const m = { new: [C.tealDim, C.teal, "NEW"], review: [C.goldDim, C.gold, "REVIEW"], approved: ["rgba(92,192,126,0.15)", C.ok, "APPROVED"], submitted: [C.purpleDim, C.purple, "SUBMITTED"], declined: ["rgba(212,114,114,0.15)", C.bad, "DECLINED"] }; const v = m[s] || m.new; return <B bg={v[0]} fg={v[1]}>{v[2]}</B>; }
function FB({ s }) { const c = s >= 90 ? C.ok : s >= 75 ? C.gold : s >= 50 ? C.warn : C.bad; return <div style={{ display: "flex", alignItems: "center", gap: 6 }}><div style={{ width: 50, height: 5, background: C.border, borderRadius: 3 }}><div style={{ width: s + "%", height: "100%", background: c, borderRadius: 3 }} /></div><span style={{ fontSize: 11, fontWeight: 700, color: c, fontFamily: mono }}>{s}%</span></div>; }
function Chip({ active, onClick, children }) { return <button onClick={onClick} style={{ padding: "5px 14px", borderRadius: 20, border: "1px solid " + (active ? C.gold : C.border), background: active ? C.goldDim : "transparent", color: active ? C.goldLight : C.textMuted, fontSize: 11, fontWeight: 600, fontFamily: ff, cursor: "pointer" }}>{children}</button>; }
function Card({ children, style, onClick }) { return <div onClick={onClick} style={{ background: C.card, borderRadius: 12, border: "1px solid " + C.border, padding: "16px 20px", ...style }}>{children}</div>; }
function SC({ label, value, color }) { return <div style={{ background: C.card, borderRadius: 10, padding: "12px 14px", border: "1px solid " + C.border, minWidth: 100 }}><p style={{ margin: 0, fontSize: 10, fontWeight: 600, color: C.textMuted, textTransform: "uppercase", letterSpacing: 0.5 }}>{label}</p><p style={{ margin: "4px 0 0", fontSize: 22, fontWeight: 800, color: color || C.text }}>{value}</p></div>; }
function Empty({ icon, msg }) { return <div style={{ padding: "40px 20px", textAlign: "center" }}><p style={{ fontSize: 28 }}>{icon}</p><p style={{ color: C.textMuted, fontSize: 13, marginTop: 8 }}>{msg}</p></div>; }
function DU({ d }) { if (!d) return null; const n = Math.ceil((new Date(d) - new Date()) / 86400000); return <span style={{ fontSize: 11, fontWeight: 600, color: n <= 14 ? C.bad : n <= 30 ? C.warn : C.textMuted, fontFamily: mono }}>{n <= 0 ? "PAST" : n + "d"}</span>; }
function jp(v) { try { return typeof v === "string" ? JSON.parse(v) : v || []; } catch { return []; } }

function PipelineTab({ rfps, onSelect }) {
  const [af, setAf] = useState("all");
  const [sf, setSf] = useState("all");
  const f = useMemo(() => rfps.filter(r => (af === "all" || r.angle === af) && (sf === "all" || r.status === sf)).sort((a, b) => (b.fit_score || 0) - (a.fit_score || 0)), [rfps, af, sf]);
  return <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
    <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
      <span style={{ fontSize: 11, fontWeight: 600, color: C.textDim }}>Angle:</span>
      <Chip active={af === "all"} onClick={() => setAf("all")}>All</Chip><Chip active={af === "beepurple"} onClick={() => setAf("beepurple")}>🐝 Direct</Chip><Chip active={af === "icp"} onClick={() => setAf("icp")}>🎯 ICP</Chip>
      <span style={{ width: 1, height: 20, background: C.border }} />
      <span style={{ fontSize: 11, fontWeight: 600, color: C.textDim }}>Status:</span>
      <Chip active={sf === "all"} onClick={() => setSf("all")}>All</Chip><Chip active={sf === "new"} onClick={() => setSf("new")}>New</Chip><Chip active={sf === "review"} onClick={() => setSf("review")}>Review</Chip><Chip active={sf === "approved"} onClick={() => setSf("approved")}>Approved</Chip>
    </div>
    {f.length === 0 ? <Empty icon="📭" msg="No RFPs match filters" /> : f.map(r => (
      <Card key={r.id} onClick={() => onSelect(r)} style={{ cursor: "pointer", borderLeftWidth: 3, borderLeftColor: r.angle === "beepurple" ? C.purple : C.gold }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
          <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}><AB a={r.angle} /><SB s={r.status} />{r.verified ? <B bg="rgba(92,192,126,0.15)" fg={C.ok}>✓ VERIFIED</B> : null}</div>
          <div style={{ display: "flex", alignItems: "center", gap: 12 }}><FB s={r.fit_score || 0} /><DU d={r.deadline} /></div>
        </div>
        <h3 style={{ margin: "0 0 4px", fontSize: 15, fontWeight: 700, color: C.text }}>{r.title}</h3>
        <p style={{ margin: "0 0 6px", fontSize: 12, color: C.textMuted }}>{r.agency} • {r.state}</p>
        <p style={{ margin: "0 0 8px", fontSize: 13, color: C.text, lineHeight: 1.5, display: "-webkit-box", WebkitLineClamp: 2, WebkitBoxOrient: "vertical", overflow: "hidden" }}>{r.overview}</p>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
          <span style={{ fontSize: 13, fontWeight: 700, color: C.ok }}>{r.amount}</span>
          {r.source_url && <a href={r.source_url} target="_blank" rel="noreferrer" onClick={e => e.stopPropagation()} style={{ fontSize: 12, color: C.teal, textDecoration: "underline" }}>Source →</a>}
        </div>
      </Card>
    ))}
  </div>;
}

function LeadsTab({ leads }) {
  const [tf, setTf] = useState("all");
  const [pf, setPf] = useState("all");
  const types = ["all", "job_signal", "award", "settlement", "new_org"];
  const f = useMemo(() => leads.filter(l => (tf === "all" || l.type === tf) && (pf === "all" || l.priority === pf) && l.type !== "contact" && l.type !== "competitor").sort((a, b) => ({ hot: 0, high: 1, medium: 2, low: 3 }[a.priority] || 3) - ({ hot: 0, high: 1, medium: 2, low: 3 }[b.priority] || 3)), [leads, tf, pf]);
  const st = useMemo(() => ({ hot: leads.filter(l => l.priority === "hot").length, jobs: leads.filter(l => l.type === "job_signal").length, awards: leads.filter(l => l.type === "award").length, settlements: leads.filter(l => l.type === "settlement").length, newOrgs: leads.filter(l => l.type === "new_org").length }), [leads]);
  return <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(120px, 1fr))", gap: 8 }}>
      <SC label="🔥 Hot" value={st.hot} color={C.hot} /><SC label="📋 Excel" value={st.jobs} color={C.warn} /><SC label="💰 Awards" value={st.awards} color={C.ok} /><SC label="⚖️ Settlement" value={st.settlements} color={C.gold} /><SC label="🌱 New Orgs" value={st.newOrgs} color={C.teal} />
    </div>
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
      <span style={{ fontSize: 11, fontWeight: 600, color: C.textDim }}>Type:</span>
      {types.map(t => <Chip key={t} active={tf === t} onClick={() => setTf(t)}>{t === "all" ? "All" : (LTYPES[t]?.icon || "") + " " + (LTYPES[t]?.l || t)}</Chip>)}
      <span style={{ width: 1, height: 20, background: C.border }} />
      {["all", "hot", "high", "medium"].map(p => <Chip key={p} active={pf === p} onClick={() => setPf(p)}>{p === "all" ? "All" : (PRIO[p]?.icon || "") + " " + (PRIO[p]?.l || p)}</Chip>)}
    </div>
    {f.length === 0 ? <Empty icon="🎯" msg="No leads match filters" /> : f.map(l => (
      <Card key={l.id} style={{ borderLeftWidth: 3, borderLeftColor: PRIO[l.priority]?.fg || C.border }}>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", marginBottom: 8 }}><TB t={l.type} /><PB p={l.priority} /></div>
        <h3 style={{ margin: "0 0 4px", fontSize: 14, fontWeight: 700, color: C.text }}>{l.title}</h3>
        {l.org_name && l.org_name !== "Multiple organizations" && <p style={{ margin: "0 0 4px", fontSize: 12, color: C.textMuted }}>{l.org_name}{l.state ? " • " + l.state : ""}</p>}
        <p style={{ margin: "0 0 6px", fontSize: 12, color: C.text, lineHeight: 1.5 }}>{l.signal}</p>
        {l.details && <p style={{ margin: "0 0 6px", fontSize: 11, color: C.textDim, lineHeight: 1.4 }}>{(l.details || "").substring(0, 300)}{l.details?.length > 300 ? "..." : ""}</p>}
        {l.contact_name && <p style={{ margin: "0 0 4px", fontSize: 12, color: C.teal }}>👤 {l.contact_name}{l.contact_title ? " — " + l.contact_title : ""}</p>}
        {l.source_url && <a href={l.source_url} target="_blank" rel="noreferrer" style={{ fontSize: 12, color: C.teal, textDecoration: "underline" }}>View →</a>}
      </Card>
    ))}
  </div>;
}

function ContactsTab({ leads }) {
  const contacts = useMemo(() => leads.filter(l => l.type === "contact").sort((a, b) => ({ hot: 0, high: 1, medium: 2, low: 3 }[a.priority] || 3) - ({ hot: 0, high: 1, medium: 2, low: 3 }[b.priority] || 3)), [leads]);
  const [f, setF] = useState("all");
  const types = ["all", "state_doh", "recovery_center", "peer_org", "ccbhc", "court", "recovery_house"];
  const fil = useMemo(() => contacts.filter(c => f === "all" || c.org_type === f), [contacts, f]);
  return <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
    <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>{types.map(t => <Chip key={t} active={f === t} onClick={() => setF(t)}>{t === "all" ? "All" : BP.icpTypes.find(i => i.id === t)?.label || t}</Chip>)}</div>
    {fil.length === 0 ? <Empty icon="👤" msg="No contacts found" /> : <div style={{ overflowX: "auto" }}>
      <table style={{ width: "100%", borderCollapse: "collapse", fontFamily: ff, fontSize: 12 }}>
        <thead><tr>{["Priority", "Name", "Title", "Organization", "State", "Type", "Signal", "Action"].map(h => <th key={h} style={{ padding: "10px 8px", textAlign: "left", fontSize: 10, fontWeight: 700, textTransform: "uppercase", color: C.textMuted, borderBottom: "1px solid " + C.border, whiteSpace: "nowrap" }}>{h}</th>)}</tr></thead>
        <tbody>{fil.map(c => <tr key={c.id} style={{ borderBottom: "1px solid " + C.border }}>
          <td style={{ padding: 8 }}><PB p={c.priority} /></td>
          <td style={{ padding: 8, color: C.text, fontWeight: 600 }}>{c.contact_name || "—"}</td>
          <td style={{ padding: 8, color: C.textMuted, fontSize: 11 }}>{c.contact_title || "—"}</td>
          <td style={{ padding: 8, color: C.goldLight, fontWeight: 600 }}>{c.org_name}</td>
          <td style={{ padding: 8, color: C.textMuted }}>{c.state}</td>
          <td style={{ padding: 8 }}><B bg={C.purpleDim} fg={C.purpleLight}>{BP.icpTypes.find(i => i.id === c.org_type)?.label || c.org_type}</B></td>
          <td style={{ padding: 8, color: C.text, fontSize: 11, maxWidth: 200 }}>{(c.signal || "").substring(0, 60)}</td>
          <td style={{ padding: 8 }}>{c.source_url && <a href={c.source_url} target="_blank" rel="noreferrer" style={{ fontSize: 11, color: C.teal }}>LinkedIn →</a>}</td>
        </tr>)}</tbody>
      </table>
    </div>}
  </div>;
}

function CompetitorsTab({ leads }) {
  const c = useMemo(() => leads.filter(l => l.type === "competitor"), [leads]);
  return <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
    {c.length === 0 ? <Empty icon="🔄" msg="No competitor signals" /> : c.map(l => (
      <Card key={l.id} style={{ borderLeftWidth: 3, borderLeftColor: C.purple }}>
        <div style={{ display: "flex", gap: 6, marginBottom: 8 }}><TB t="competitor" /><PB p={l.priority} /></div>
        <h3 style={{ margin: "0 0 4px", fontSize: 14, fontWeight: 700, color: C.text }}>{l.title}</h3>
        <p style={{ margin: "0 0 8px", fontSize: 12, color: C.text, lineHeight: 1.6 }}>{l.signal}</p>
        <p style={{ margin: "0 0 8px", fontSize: 11, color: C.textDim, lineHeight: 1.5, whiteSpace: "pre-wrap" }}>{l.details}</p>
        {l.source_url && <a href={l.source_url} target="_blank" rel="noreferrer" style={{ fontSize: 12, color: C.teal, textDecoration: "underline" }}>Search signals →</a>}
      </Card>
    ))}
  </div>;
}

function EventsTab({ events }) {
  return <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
    {events.length === 0 ? <Empty icon="📅" msg="No events loaded" /> : events.map(ev => {
      const d = Math.ceil((new Date(ev.date_start) - new Date()) / 86400000);
      const icps = jp(ev.icp_types);
      return <Card key={ev.id}>
        <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 8 }}>
          <PB p={ev.priority} />
          <B bg={d <= 30 ? "rgba(255,68,68,0.15)" : "rgba(77,184,168,0.15)"} fg={d <= 30 ? C.hot : C.teal}>{d <= 0 ? "NOW" : d + " days"}</B>
        </div>
        <h3 style={{ margin: "0 0 6px", fontSize: 16, fontWeight: 700, color: C.text }}>{ev.name}</h3>
        <p style={{ margin: "0 0 6px", fontSize: 12, color: C.gold }}>📍 {ev.city || "TBD"}{ev.state && ev.state !== "TBD" ? ", " + ev.state : ""} · 📆 {new Date(ev.date_start).toLocaleDateString("en-US", { month: "long", day: "numeric" })}{ev.date_end ? " – " + new Date(ev.date_end).toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) : ""}</p>
        <p style={{ margin: "0 0 8px", fontSize: 13, color: C.text, lineHeight: 1.6 }}>{ev.description}</p>
        {icps.length > 0 && <div style={{ display: "flex", gap: 4, flexWrap: "wrap", marginBottom: 8 }}>{icps.map(t => <B key={t} bg={C.purpleDim} fg={C.purpleLight}>{BP.icpTypes.find(i => i.id === t)?.label || t}</B>)}</div>}
        {ev.url && <a href={ev.url} target="_blank" rel="noreferrer" style={{ fontSize: 12, color: C.teal, textDecoration: "underline" }}>Event Website →</a>}
      </Card>;
    })}
  </div>;
}

function RfpDetail({ rfp, onBack }) {
  const reqs = jp(rfp.requirements);
  const icps = jp(rfp.icp_types);
  return <div style={{ display: "flex", flexDirection: "column", gap: 16 }}>
    <button onClick={onBack} style={{ alignSelf: "flex-start", padding: "6px 16px", borderRadius: 8, border: "1px solid " + C.border, background: C.surface, color: C.textMuted, fontSize: 12, fontFamily: ff, cursor: "pointer" }}>← Back</button>
    <Card>
      <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 12 }}><AB a={rfp.angle} /><SB s={rfp.status} />{rfp.verified ? <B bg="rgba(92,192,126,0.15)" fg={C.ok}>✓ VERIFIED</B> : null}<FB s={rfp.fit_score || 0} /></div>
      <h2 style={{ margin: "0 0 8px", fontSize: 20, fontWeight: 700, color: C.text }}>{rfp.title}</h2>
      <p style={{ margin: "0 0 4px", fontSize: 13, color: C.textMuted }}>{rfp.agency} • {rfp.state}</p>
      <p style={{ margin: "0 0 12px", fontSize: 14, fontWeight: 700, color: C.ok }}>{rfp.amount}</p>
      {rfp.deadline && <div style={{ padding: "10px 14px", background: "rgba(232,169,77,0.08)", borderRadius: 8, borderLeft: "3px solid " + C.warn, marginBottom: 12 }}>
        <p style={{ margin: 0, fontSize: 12, fontWeight: 600, color: C.warn }}>📆 Deadline: {new Date(rfp.deadline).toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" })}</p>
        {rfp.deadline_note && <p style={{ margin: "4px 0 0", fontSize: 12, color: C.text }}>{rfp.deadline_note}</p>}
      </div>}
      <p style={{ fontSize: 14, color: C.text, lineHeight: 1.7, marginBottom: 16 }}>{rfp.overview}</p>
      {rfp.fit_reason && <div style={{ padding: "12px 16px", background: C.purpleDim, borderRadius: 8, borderLeft: "3px solid " + C.purple, marginBottom: 12 }}>
        <p style={{ margin: 0, fontSize: 12, fontWeight: 700, color: C.purpleLight }}>🐝 BeePurple Fit Analysis</p>
        <p style={{ margin: "6px 0 0", fontSize: 13, color: C.text, lineHeight: 1.6 }}>{rfp.fit_reason}</p>
      </div>}
      {reqs.length > 0 && <div style={{ marginBottom: 12 }}><p style={{ fontSize: 12, fontWeight: 700, color: C.textMuted, textTransform: "uppercase", marginBottom: 8 }}>Requirements</p>{reqs.map((r, i) => <div key={i} style={{ padding: "6px 0", borderBottom: "1px solid " + C.border, fontSize: 13, color: C.text }}>• {r}</div>)}</div>}
      {icps.length > 0 && <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}><span style={{ fontSize: 11, color: C.textMuted, fontWeight: 600 }}>ICPs:</span>{icps.map(t => <B key={t} bg={C.goldDim} fg={C.goldLight}>{BP.icpTypes.find(i => i.id === t)?.label || t}</B>)}</div>}
      {rfp.source_url && <div style={{ marginTop: 12 }}><a href={rfp.source_url} target="_blank" rel="noreferrer" style={{ display: "inline-block", padding: "10px 20px", borderRadius: 8, background: "linear-gradient(135deg," + C.gold + "," + C.purple + ")", color: C.white, fontSize: 13, fontWeight: 700, textDecoration: "none" }}>View Original Listing →</a></div>}
    </Card>
  </div>;
}

function App() {
  const [tab, setTab] = useState("pipeline");
  const [rfps, setRfps] = useState([]);
  const [leads, setLeads] = useState([]);
  const [events, setEvents] = useState([]);
  const [sel, setSel] = useState(null);
  const [loading, setLoading] = useState(true);

  useEffect(() => {
    (async () => {
      try {
        const [r, l, e] = await Promise.allSettled([
          fetch(API + "/api/rfps").then(r => r.json()),
          fetch(API + "/api/leads").then(r => r.json()),
          fetch(API + "/api/events").then(r => r.json()),
        ]);
        if (r.status === "fulfilled" && r.value?.rfps) setRfps(r.value.rfps);
        if (l.status === "fulfilled" && l.value?.leads) setLeads(l.value.leads);
        if (e.status === "fulfilled" && e.value?.events) setEvents(e.value.events);
      } catch (err) { console.error(err); }
      setLoading(false);
    })();
  }, []);

  const st = useMemo(() => ({ rfps: rfps.length, bp: rfps.filter(r => r.angle === "beepurple").length, icp: rfps.filter(r => r.angle === "icp").length, leads: leads.length, hot: leads.filter(l => l.priority === "hot").length, contacts: leads.filter(l => l.type === "contact").length, comps: leads.filter(l => l.type === "competitor").length, events: events.length }), [rfps, leads, events]);
  const tabs = [{ id: "pipeline", l: "📄 RFPs", n: st.rfps }, { id: "leads", l: "🎯 Leads", n: st.leads - st.contacts - st.comps, bc: st.hot > 0 ? C.hot : null }, { id: "contacts", l: "👤 Contacts", n: st.contacts }, { id: "competitors", l: "🔄 Competitors", n: st.comps }, { id: "events", l: "📅 Events", n: st.events }];

  return <div style={{ minHeight: "100vh", background: C.bg, color: C.text, fontFamily: ff }}>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>{`* { box-sizing: border-box; } ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: ${C.bg}; } ::-webkit-scrollbar-thumb { background: ${C.border}; border-radius: 3px; }`}</style>
    <header style={{ background: C.surface, borderBottom: "1px solid " + C.border, padding: "12px 20px" }}>
      <div style={{ maxWidth: 1200, margin: "0 auto", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 10 }}>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}><span style={{ fontSize: 26 }}>🐝</span><div><h1 style={{ margin: 0, fontSize: 18, fontWeight: 700, color: C.text }}>BeePurple Sales Pipeline</h1><p style={{ margin: 0, fontSize: 11, color: C.textMuted }}>RFPs • Lead Intelligence • Events • Contacts</p></div></div>
        <div style={{ display: "flex", gap: 8 }}>{st.hot > 0 && <B bg="rgba(255,68,68,0.15)" fg={C.hot}>🔥 {st.hot} hot</B>}<B bg={C.tealDim} fg={C.teal}>{st.rfps + st.leads} tracked</B></div>
      </div>
    </header>
    <nav style={{ background: C.surface, borderBottom: "1px solid " + C.border, padding: "0 20px", overflowX: "auto" }}>
      <div style={{ maxWidth: 1200, margin: "0 auto", display: "flex" }}>
        {tabs.map(t => <button key={t.id} onClick={() => { setTab(t.id); setSel(null); }} style={{ padding: "12px 18px", background: "none", border: "none", borderBottom: tab === t.id ? "2px solid " + C.gold : "2px solid transparent", color: tab === t.id ? C.goldLight : C.textMuted, fontSize: 13, fontWeight: 600, fontFamily: ff, cursor: "pointer", display: "flex", alignItems: "center", gap: 6, whiteSpace: "nowrap" }}>
          {t.l}<span style={{ padding: "1px 8px", borderRadius: 10, fontSize: 10, fontWeight: 700, background: t.bc ? t.bc + "22" : C.elevated, color: t.bc || C.textMuted }}>{t.n}</span>
        </button>)}
      </div>
    </nav>
    <div style={{ background: C.card, borderBottom: "1px solid " + C.border, padding: "12px 20px" }}>
      <div style={{ maxWidth: 1200, margin: "0 auto", display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(110px, 1fr))", gap: 8 }}>
        <SC label="Total RFPs" value={st.rfps} color={C.text} /><SC label="🐝 Direct" value={st.bp} color={C.purpleLight} /><SC label="🎯 ICP" value={st.icp} color={C.goldLight} /><SC label="🔥 Hot Leads" value={st.hot} color={C.hot} /><SC label="Total Leads" value={st.leads} color={C.teal} /><SC label="📅 Events" value={st.events} color={C.ok} />
      </div>
    </div>
    <main style={{ maxWidth: 1200, margin: "0 auto", padding: "20px 16px" }}>
      {loading ? <Empty icon="⏳" msg="Loading from BeePurple backend..." /> :
        sel ? <RfpDetail rfp={sel} onBack={() => setSel(null)} /> :
        tab === "pipeline" ? <PipelineTab rfps={rfps} onSelect={setSel} /> :
        tab === "leads" ? <LeadsTab leads={leads} /> :
        tab === "contacts" ? <ContactsTab leads={leads} /> :
        tab === "competitors" ? <CompetitorsTab leads={leads} /> :
        tab === "events" ? <EventsTab events={events} /> : null}
    </main>
    <footer style={{ borderTop: "1px solid " + C.border, padding: "12px 20px", textAlign: "center" }}>
      <p style={{ margin: 0, fontSize: 11, color: C.textDim }}>BeePurple Sales Pipeline • {st.rfps} RFPs • {st.leads} Leads • {st.events} Events</p>
    </footer>
  </div>;
}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
